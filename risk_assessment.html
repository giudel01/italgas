<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">

<link rel="stylesheet" href="risk_assessment.cssdbx" />

<!-- sys_id del record da aggiornare, passato come parametro URL -->
<input type="hidden" id="ra_sys_id" value="${sysparm_sys_id}" />

<!-- LOADING OVERLAY -->
<div id="ra-loading" class="ra-loading-overlay">
  <div class="ra-loading-box">
    <div class="ra-spinner-lg"></div>
    <p>Caricamento record in corso…</p>
  </div>
</div>

<div class="ra-wrapper" id="ra-main" style="display:none">

  <!-- HEADER -->
  <div class="ra-header">
    <div class="ra-header-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
    </div>
    <div>
      <h1 class="ra-title">Risk Assessment</h1>
      <p class="ra-subtitle" id="ra-record-label">Aggiornamento valutazione del rischio</p>
    </div>
  </div>

  <!-- SEZIONE: RISCHIO INERENTE -->
  <div class="ra-card">
    <div class="ra-card-header">
      <div class="ra-card-icon rischio-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      </div>
      <div>
        <h2 class="ra-card-title">Rischio Inerente</h2>
        <p class="ra-card-desc">Valutazione del rischio prima delle misure di controllo</p>
      </div>
    </div>

    <div class="ra-grid-3">
      <!-- Impatto -->
      <div class="ra-field-group">
        <label class="ra-label" for="impatto_inerente">Impatto Inerente 231</label>
        <div class="ra-select-wrapper">
          <select id="impatto_inerente" class="ra-select">
            <option value="">— Seleziona —</option>
            <option value="alto">Alto</option>
            <option value="medio">Medio</option>
            <option value="basso">Basso</option>
          </select>
          <div class="ra-select-arrow">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- Probabilità -->
      <div class="ra-field-group">
        <label class="ra-label" for="probabilita_inerente">Probabilità Inerente 231</label>
        <div class="ra-select-wrapper">
          <select id="probabilita_inerente" class="ra-select">
            <option value="">— Seleziona —</option>
            <option value="alto">Alto</option>
            <option value="medio">Medio</option>
            <option value="basso">Basso</option>
          </select>
          <div class="ra-select-arrow">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- Rischio Inerente (calcolato) -->
      <div class="ra-field-group">
        <label class="ra-label">Rischio Inerente</label>
        <div class="ra-computed-field" id="rischio_inerente_display">
          <span class="ra-computed-placeholder">Calcolato automaticamente</span>
        </div>
        <input type="hidden" id="rischio_inerente" />
      </div>
    </div>
  </div>

  <!-- SEZIONE: CONTROLLI (righe mostrate dinamicamente) -->
  <div class="ra-card" id="ra-controls-card">
    <div class="ra-card-header">
      <div class="ra-card-icon controlli-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <polyline points="9 12 11 14 15 10"/>
        </svg>
      </div>
      <div>
        <h2 class="ra-card-title">Controlli e Valutazioni</h2>
        <p class="ra-card-desc">Valuta l'efficacia dei controlli associati al rischio</p>
      </div>
    </div>

    <!-- Righe generate dinamicamente da JS leggendo la tabella M2M -->
    <div class="ra-controls-grid" id="ra-controls-grid">
      <div class="ra-controls-loading">
        <div class="ra-spinner"></div>
        <span>Caricamento controlli…</span>
      </div>
    </div>
  </div>

  <!-- AZIONI -->
  <div class="ra-actions">
    <button type="button" class="ra-btn ra-btn-secondary" onclick="reloadRecord()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="1 4 1 10 7 10"/>
        <path d="M3.51 15a9 9 0 102.13-9.36L1 10"/>
      </svg>
      Annulla modifiche
    </button>
    <button type="button" class="ra-btn ra-btn-primary" onclick="submitForm()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      Salva modifiche
    </button>
  </div>

</div>

<!-- TOAST NOTIFICHE -->
<div id="ra-toast" class="ra-toast"></div>

<script src="risk_assessment.js.jsdbx"></script>

</j:jelly>
